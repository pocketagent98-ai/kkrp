# Capability Registry
# The agent uses this to decide which tools to activate per task.
# Only needed capabilities are loaded — no fixed toolchain.

capabilities:
  # === CODE GENERATION ===
  code_generation:
    description: "Generate GDScript / C# code for Godot"
    tools:
      - deepseek_harness
      - openmanus
    triggered_when: "always"

  # === ASSET GENERATION ===
  asset_simple:
    description: "Procedural simple assets in Godot"
    tools:
      - godot_procedural
    triggered_when: "need_simple_geometry"

  asset_detailed:
    description: "Detailed 3D models via Blender"
    tools:
      - blender_worker
    triggered_when: "need_complex_3d"

  asset_visual:
    description: "Textures and 2D art via ComfyUI"
    tools:
      - comfyui
    triggered_when: "need_textures_or_2d"

  world_generation:
    description: "World/terrain generation via NVIDIA Cosmos"
    tools:
      - cosmos_worker
    triggered_when: "need_world_generation"
    note: "Cosmos outputs need Godot-side assembly for playability"

  # === TESTING ===
  unit_testing:
    description: "Run GdUnit4 tests"
    tools:
      - gdunit4
    triggered_when: "post_code_generation"

  gameplay_qa:
    description: "Automated gameplay testing"
    tools:
      - gameplay_qa_agent
    triggered_when: "post_build"

  performance_qa:
    description: "Performance profiling"
    tools:
      - godot_profiler
    triggered_when: "post_build"

  # === SECURITY ===
  security_scan:
    description: "SAST, dependency scan, secret scan"
    tools:
      - strix_sast
      - dependency_scanner
      - secret_scanner
    triggered_when: "pre_release"

  # === INFRASTRUCTURE ===
  authentication:
    description: "User auth via Supabase"
    tools:
      - supabase_auth
    triggered_when: "need_user_accounts"

  realtime:
    description: "Realtime coordination via Cloudflare DO"
    tools:
      - cloudflare_durable_objects
    triggered_when: "need_multiplayer"

  multiplayer_server:
    description: "Authoritative game server"
    tools:
      - godot_dedicated_server
    triggered_when: "need_authoritative_multiplayer"

# === LLM PROVIDERS ===
providers:
  - name: omniRoute
    priority: 1
  - name: google
    priority: 2
    models:
      - gemini-3.7-flash
      - gemini-3.6-flash
      - gemini-3.5-flash
      - gemini-3.5-flash-lite
      - gemma-4-31b-it
      - gemma-4-26b-a4b-it
  - name: nvidia
    priority: 3
  - name: nararouter
    priority: 4

# === DECISION POLICY ===
policy:
  - "Always use latest stable Godot (currently 4.7.2)"
  - "Never auto-upgrade engine without migration testing"
  - "Never deploy without passing all QA stages"
  - "Legal compliance is human-reviewed, not AI-guaranteed"
  - "Store all project records permanently in projects/ directory"
