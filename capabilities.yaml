# Game Factory — Capability Registry
version: "1.0.0"
project: "Desert Rush: City Builder Escape"

llm_providers:
  primary:
    name: "openai"
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
  secondary:
    name: "anthropic"
    model: "claude-3-5-sonnet"
    api_key_env: "ANTHROPIC_API_KEY"
  local:
    name: "ollama"
    model: "llama3:8b"
    endpoint: "http://localhost:11434"
  fallback:
    name: "template"
    model: "none"
    description: "Rule-based code generation when no LLM is available"

capabilities:
  code_generation:
    description: "Generate GDScript code from task descriptions"
    enabled: true
    agent: "coder"
    providers: [primary, secondary, local, fallback]
  asset_simple:
    description: "Procedural meshes, materials, textures"
    enabled: true
    agent: "coder"
    providers: [primary, fallback]
  asset_detailed:
    description: "Detailed 2D/3D assets via image generation"
    enabled: false
    agent: "asset_generator"
  world_generation:
    description: "Generate game worlds, levels, terrain"
    enabled: true
    agent: "planner"
    providers: [primary, secondary, fallback]
  unit_testing:
    description: "GdUnit4 test generation and running"
    enabled: true
    agent: "tester"
    providers: [primary, secondary, fallback]
    framework: "GdUnit4"
    coverage_target: 0.8
  gameplay_qa:
    description: "Headless gameplay testing with crash detection"
    enabled: true
    agent: "tester"
    providers: [fallback]
    crash_detection: true
  security_scan:
    description: "Scan for security vulnerabilities"
    enabled: true
    agent: "reviewer"
    providers: [fallback]
    checks: [hardcoded_secrets, sql_injection, xss]
  authentication:
    description: "User auth via Supabase"
    enabled: true
    provider: "supabase"
    methods: [email_password, oauth_google, anonymous]
    offline_fallback: "local_save"
  realtime:
    description: "Real-time multiplayer"
    enabled: false
  multiplayer_server:
    description: "Dedicated multiplayer server"
    enabled: false
    max_players: 1

pipeline_stages:
  - {id: "01_parse_spec", name: "Parse Specification", required: true}
  - {id: "02_plan_game", name: "Plan Game", required: true}
  - {id: "03_create_tasks", name: "Create Task Graph", required: true}
  - {id: "04_start_sandbox", name: "Start Sandbox", required: true}
  - {id: "05_generate_code", name: "Generate Code", required: true}
  - {id: "06_generate_assets", name: "Generate Assets", required: false}
  - {id: "07_import_assets", name: "Import Assets", required: true}
  - {id: "08_build_godot", name: "Build Godot Project", required: true}
  - {id: "09_run_tests", name: "Run Tests", required: true}
  - {id: "10_ai_review", name: "AI Code Review", required: true}
  - {id: "11_fix_errors", name: "Fix Errors", required: true}
  - {id: "12_build_apk", name: "Build APK", required: true}
  - {id: "13_upload_artifact", name: "Upload Artifact", required: true}
  - {id: "14_cleanup", name: "Cleanup", required: true}
